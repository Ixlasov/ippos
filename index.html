<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>IP POS Tizimi</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: auto; }
        #app-container { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>

<div id="app-container">Tizim yuklanmoqda...</div>

<script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbxSazNyjA0HqKWgDDBmTUo9hQWX0ZEvet93Fkz1meljsCo_ycz4IIeu0yetpG4Q-DL9kg/exec";

    // Allorigins proksisi orqali Google-dagi tayyor HTML sahifani yuklab olamiz
    fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(GOOGLE_URL)}`)
        .then(response => response.text())
        .then(html => {
            // Yuklangan to'liq HTML-ni container ichiga joylashtiramiz
            document.getElementById('app-container').innerHTML = html;
            
            // Ichidagi scriptlar ishlashi uchun ularni qayta yuklash kerak bo'lishi mumkin
            const scripts = document.getElementById('app-container').getElementsByTagName('script');
            for (let n = 0; n < scripts.length; n++) {
                eval(scripts[n].innerText);
            }
        })
        .catch(err => {
            document.getElementById('app-container').innerText = "Yuklashda xatolik yuz berdi.";
            console.error(err);
        });
</script>

</body>
</html>
